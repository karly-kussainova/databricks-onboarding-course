# A sample job for finhub_api.

resources:
  jobs:
    sample_job:
      name: finhub_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: CallingStocks
          notebook_task:
            notebook_path: ../src/finhub_api/CallingStocks.py

        - task_key: GoldTransformation
          depends_on:
            - task_key: CallingStocks
          notebook_task:
            notebook_path: ../src/finhub_api/GoldTransformation.py

        - task_key: MoveContract
          depends_on:
            - task_key: GoldTransformation
          notebook_task:
            notebook_path: ../src/finhub_api/MoveContract.py


      environments:
        - environment_key: default
          spec:
            environment_version: "4"
