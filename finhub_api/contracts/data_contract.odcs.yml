slaProperties:
  - property: generalAvailability
    value: >
      Data is loaded on-demand by running the ingestion notebook manually
      or triggering the Databricks job defined in resources/sample_job.job.yml.
  - property: retention
    value: P90D
  - property: latency
    value: 24
    unit: h
  - property: support
    value: Demo environment - best effort only